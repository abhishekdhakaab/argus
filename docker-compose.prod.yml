services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  mcp-rag:
    build:
      context: .
      dockerfile: mcp_servers/rag/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HF_HOME: /models/huggingface
      HF_HUB_DISABLE_XET: "1"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${ARGUS_HF_CACHE:-/private/tmp/argus-hf-cache}:/models/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mcp-sql:
    build:
      context: .
      dockerfile: mcp_servers/sql/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mcp-api:
    build:
      context: .
      dockerfile: mcp_servers/external_api/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8083:8080"
    depends_on:
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      DOC_MCP_URL: http://mcp-rag:8080
      SQL_MCP_URL: http://mcp-sql:8080
      EXTERNAL_API_MCP_URL: http://mcp-api:8080
      JWT_PRIVATE_KEY_PATH: /app/gateway/private.pem
      JWT_PUBLIC_KEY_PATH: /app/gateway/public.pem
      JWT_ISSUER: argus-gateway
      DEV_AUTH_PASSWORD: ${DEV_AUTH_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_CHAT_COMPLETIONS_URL: ${OPENAI_CHAT_COMPLETIONS_URL:-http://host.docker.internal:11434/v1/chat/completions}
      SYNTHESIS_MODEL: ${SYNTHESIS_MODEL:-llama3.2:1b}
      PLANNER_MODEL: ${PLANNER_MODEL:-llama3.2:1b}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-rag:
        condition: service_started
      mcp-sql:
        condition: service_started
      mcp-api:
        condition: service_started
    volumes:
      - ${JWT_PRIVATE_KEY_FILE:-./gateway/private.pem}:/app/gateway/private.pem:ro
      - ${JWT_PUBLIC_KEY_FILE:-./gateway/public.pem}:/app/gateway/public.pem:ro

volumes:
  prod_postgres_data:
